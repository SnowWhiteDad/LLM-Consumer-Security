<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Article Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF Article Viewer</h1>
            <p>View and read PDF documents online</p>
        </header>

        <div class="upload-section">
            <label for="pdf-upload" class="upload-button">
                Choose PDF File
                <input type="file" id="pdf-upload" accept=".pdf" style="display: none;">
            </label>
            <button id="load-sample" class="sample-button">Load Sample Article</button>
        </div>

        <div id="pdf-controls" class="controls" style="display: none;">
            <button id="prev-page" class="control-btn">Previous</button>
            <span class="page-info">
                Page <span id="page-num">1</span> of <span id="page-count">0</span>
            </span>
            <button id="next-page" class="control-btn">Next</button>
            <div class="zoom-controls">
                <button id="zoom-out" class="control-btn">-</button>
                <span id="zoom-level">100%</span>
                <button id="zoom-in" class="control-btn">+</button>
            </div>
        </div>

        <div id="pdf-viewer" class="pdf-viewer">
            <div class="placeholder">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                    <path d="M20 10h60v80H20z" stroke="#ccc" stroke-width="2" fill="#f9f9f9"/>
                    <line x1="30" y1="25" x2="70" y2="25" stroke="#ddd" stroke-width="2"/>
                    <line x1="30" y1="35" x2="70" y2="35" stroke="#ddd" stroke-width="2"/>
                    <line x1="30" y1="45" x2="70" y2="45" stroke="#ddd" stroke-width="2"/>
                    <line x1="30" y1="55" x2="60" y2="55" stroke="#ddd" stroke-width="2"/>
                </svg>
                <p>Upload a PDF or load the sample article to begin</p>
            </div>
            <canvas id="pdf-canvas"></canvas>
        </div>

        <footer>
            <p>Built with <a href="https://mozilla.github.io/pdf.js/" target="_blank">PDF.js</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
